<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cristian Esplana</title>
    <link rel="icon" type="image/png" href="Cat.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <h1 class="logo"><img src="Cat.png" alt="logo" class="logo-icon">CRISTIAN</h1>
            <div class="header-right">
                <button id="themeToggle" class="theme-btn" title="Toggle Dark/Light Mode">
                    <i class="fa fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="mobile-container">
        <section class="page active">
            <div class="hero-header" style="text-align:center;">
                <h1>Welcome</h1>
                <p>Enter the password to access the portfolio.</p>
            </div>
            <div class="login-box">
                <div class="login-icon">
                    <i class="fa fa-lock"></i>
                </div>
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="loginPassword"><i class="fa fa-key"></i> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter password..." required autofocus>
                            <button type="button" id="togglePassword" class="toggle-password" title="Show password">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <p id="loginError" class="login-error"></p>
                    <button type="submit" class="login-btn">
                        <i class="fa fa-sign-in-alt"></i> Enter Portfolio
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
        <p>&copy; 2026 Cristian Esplana. All rights reserved.</p>
    </footer>

    <script>
        class LoginTheme {
            constructor() {
                this.btn  = document.getElementById('themeToggle');
                this.icon = this.btn.querySelector('i');
                this._restore();
                this.btn.addEventListener('click', () => this._toggle());
            }

            _toggle() {
                this._apply(!document.body.classList.contains('dark'));
            }

            _apply(isDark) {
                document.body.classList.toggle('dark', isDark);
                const [add, remove] = isDark ? ['fa-sun', 'fa-moon'] : ['fa-moon', 'fa-sun'];
                this.icon.classList.replace(remove, add);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            _restore() {
                if (localStorage.getItem('theme') === 'dark') this._apply(true);
            }
        }

        class LoginForm {
            constructor(password) {
                this.password  = password;
                this.form      = document.getElementById('loginForm');
                this.input     = document.getElementById('loginPassword');
                this.error     = document.getElementById('loginError');
                this.toggleBtn = document.getElementById('togglePassword');
                this.eyeIcon   = this.toggleBtn.querySelector('i');

                this.toggleBtn.addEventListener('click', () => this._toggleVisibility());
                this.form.addEventListener('submit', (e) => this._handleSubmit(e));
            }

            _toggleVisibility() {
                const isHidden = this.input.type === 'password';
                this.input.type = isHidden ? 'text' : 'password';
                this.eyeIcon.classList.replace(
                    isHidden ? 'fa-eye' : 'fa-eye-slash',
                    isHidden ? 'fa-eye-slash' : 'fa-eye'
                );
            }

            _handleSubmit(e) {
                e.preventDefault();
                if (this.input.value === this.password) {
                    sessionStorage.setItem('portfolio_auth', 'true');
                    window.location.href = 'index.html';
                } else {
                    this.error.textContent = 'Incorrect password. Please try again.';
                    this.input.value = '';
                    this.input.focus();
                }
            }
        }

        class LoginPage {
            constructor() {
                if (sessionStorage.getItem('portfolio_auth') === 'true') {
                    window.location.href = 'index.html';
                    return;
                }
                this.theme = new LoginTheme();
                this.form  = new LoginForm('devqa2026');
            }
        }

        new LoginPage();
    </script>
</body>
</html>
