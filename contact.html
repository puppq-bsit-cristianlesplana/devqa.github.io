<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(sessionStorage.getItem("portfolio_auth")!=="true")window.location.href="login.html";</script>
    <title>Contact | Cristian Esplana</title>
    <link rel="icon" type="image/png" href="Cat.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="Cat.png" alt="logo" class="logo-icon">CRISTIAN</a>
            <nav class="tubelight-nav">
                <a href="index.html" class="tubelight-link" data-page="index"><i class="fa fa-home"></i><span>Home</span></a>
                <a href="projects.html" class="tubelight-link" data-page="projects"><i class="fa fa-code"></i><span>Projects</span></a>
                <a href="about.html" class="tubelight-link" data-page="about"><i class="fa fa-user"></i><span>About</span></a>
                <a href="contact.html" class="tubelight-link" data-page="contact"><i class="fa fa-envelope"></i><span>Contact</span></a>
            </nav>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="siteSearch" placeholder="Search...">
                </div>
                <a href="#" class="desktop-signout" data-logout title="Sign Out"><i class="fa fa-sign-out-alt"></i></a>
                <button id="menuBtn" class="menu-trigger">MENU ☰</button>
            </div>
        </div>
    </header>

    <div id="navModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="menu-extras">
                <div class="menu-search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" id="menuSearch" placeholder="Search...">
                </div>
            </div>
            <nav>
                <ul class="menu-list">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="projects.html">PROJECTS</a></li>
                    <li><a href="about.html">ABOUT ME</a></li>
                    <li><a href="contact.html">CONTACT US</a></li>
                    <li><a href="#" class="logout-link" data-logout><i class="fa fa-sign-out-alt"></i> SIGN OUT</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <main class="mobile-container">
        <section id="contact" class="page active">
            <h2>CONTACT US</h2>
            <div class="contact-grid">
                <div class="card contact-info-card">
                    <h3>Get in Touch</h3>
                    <p><i class="fa fa-phone"></i> +63 900 000 0000</p>
                    <p><i class="fa fa-envelope"></i> cristian.e@email.com</p>
                    <p><i class="fa fa-map-marker-alt"></i> Manila, Philippines</p>
                </div>

                <div class="card contact-form-card">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Your Message</label>
                            <textarea id="message" placeholder="How can I help you?" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="send-btn">
                            <span>Send Message</span>
                            <i class="fa fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
        <p>&copy; 2026 Cristian Esplana. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
