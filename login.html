<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cristian Esplana</title>
    <link rel="icon" type="image/png" href="Cat.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <h1 class="logo"><img src="Cat.png" alt="logo" class="logo-icon">CRISTIAN</h1>
            <div class="header-right">
                <button id="themeToggle" class="theme-btn" title="Toggle Dark/Light Mode">
                    <i class="fa fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="mobile-container">
        <section class="page active">
            <div class="hero-header" style="text-align:center;">
                <h1>Welcome</h1>
                <p>Enter the password to access the portfolio.</p>
            </div>
            <div class="login-box">
                <div class="login-icon">
                    <i class="fa fa-lock"></i>
                </div>
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="loginPassword"><i class="fa fa-key"></i> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter password..." required autofocus>
                            <button type="button" id="togglePassword" class="toggle-password" title="Show password">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <p id="loginError" class="login-error"></p>
                    <button type="submit" class="login-btn">
                        <i class="fa fa-sign-in-alt"></i> Enter Portfolio
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
        <p>&copy; 2026 Cristian Esplana. All rights reserved.</p>
    </footer>

    <script>
        // Dark mode
        const themeBtn = document.getElementById("themeToggle");
        const icon = themeBtn.querySelector("i");
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
            icon.classList.replace("fa-moon", "fa-sun");
        }
        themeBtn.onclick = () => {
            document.body.classList.toggle("dark");
            if (document.body.classList.contains("dark")) {
                icon.classList.replace("fa-moon", "fa-sun");
                localStorage.setItem("theme", "dark");
            } else {
                icon.classList.replace("fa-sun", "fa-moon");
                localStorage.setItem("theme", "light");
            }
        };

        // Toggle password visibility
        document.getElementById("togglePassword").onclick = () => {
            const input = document.getElementById("loginPassword");
            const eyeIcon = document.querySelector("#togglePassword i");
            if (input.type === "password") {
                input.type = "text";
                eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        };

        // Password check
        const SITE_PASSWORD = "devqa2026";

        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const input = document.getElementById("loginPassword").value;
            const errorEl = document.getElementById("loginError");

            if (input === SITE_PASSWORD) {
                sessionStorage.setItem("portfolio_auth", "true");
                window.location.href = "index.html";
            } else {
                errorEl.textContent = "Incorrect password. Please try again.";
                document.getElementById("loginPassword").value = "";
                document.getElementById("loginPassword").focus();
            }
        });

        // If already logged in, skip to portfolio
        if (sessionStorage.getItem("portfolio_auth") === "true") {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
